# QiZheng Chart Theme Tokens
# 十四政司宇图表主题令牌 - 图表渲染值的唯一真实来源
# Single source of truth for chart rendering values
version: 1
brightness: light

# ── 语义颜色 ──────────────────────────────────────────────────────────
# 颜色值使用 "#RRGGBB" 或 "#AARRGGBB" 十六进制格式
# Flutter Colors 常量映射:
#   Colors.black       = Color(0xFF000000) → "#000000"
#   Colors.black87     = Color(0xDD000000) → "#DD000000"
#   Colors.grey        = Color(0xFF9E9E9E) → "#9E9E9E"
#   Colors.black38     = Color(0x61000000) → "#61000000"
#   Colors.blueAccent  = Color(0xFF448AFF) → "#448AFF"
#   Colors.black45     = Color(0x73000000) → "#73000000"
#   Colors.red         = Color(0xFFF44336) → "#F44336"
#   Colors.black12     = Color(0x1F000000) → "#1F000000"
colors:
  ringStroke: "#000000"        # Colors.black
  divider: "#DD000000"         # Colors.black87
  border: "#9E9E9E"            # Colors.grey
  shadow: "#61000000"          # Colors.black38
  scaleTick: "#DD000000"       # Colors.black87
  scaleTickAccent: "#448AFF"   # Colors.blueAccent
  labelDefault: "#000000"      # Colors.black
  labelMuted: "#73000000"      # Colors.black45
  annotationYin: "#73000000"   # Colors.black45
  annotationSu: "#F44336"      # Colors.red
  sectorBorder: "#1F000000"    # Colors.black12
  northLine: "#F44336"         # Colors.red

# ── 排版 ──────────────────────────────────────────────────────────────
# fontWeight: normal(=w400), w400, w700(=bold)
typography:
  constellationName:
    family: MaShanZheng
    fontSize: 16.0
    fontWeight: normal
    height: 1.0
  starName:
    family: NotoSansSC
    fontSize: 24.0
    fontWeight: normal
    height: 1.0
  gongName:
    family: NotoSansSC
    fontSize: 18.0
    fontWeight: normal
    height: 1.2
  degree:
    family: NotoSansSC
    fontSize: 14.0
    fontWeight: w400
    height: 1.0
  yearMonth:
    family: NotoSansSC
    fontSize: 10.0
    fontWeight: normal
    height: 1.0
  shenSha:
    family: NotoSansSC
    fontSize: 14.0
    fontWeight: normal
    height: 1.0

# ── 几何尺寸 ──────────────────────────────────────────────────────────
geometry:
  ringStrokeWidth: 0.5
  tickLength: 5.0
  longTickLength: 10.0
  innerPadding: 12.0
  outerPadding: 12.0
  guideDotRadius: 2.0
  starHolderRadius: 6.0

# ── 星曜色板 ──────────────────────────────────────────────────────────
# 星曜颜色，用于绘制星曜标记
starPalette:
  # 四正星（zheng）颜色 - EnumStars 七政
  zheng:
    Sun: "#433C2D"
    Moon: "#D6ECF0"
    Mars: "#E95464"
    Saturn: "#A88462"
    Mercury: "#4C8DAE"
    Jupiter: "#549688"
    Venus: "#F0A72E"
  # 星曜（stars）颜色 - EnumStars 全部十一星
  stars:
    Sun: "#FFA400"
    Moon: "#A1AFC9"
    Mars: "#E95464"
    Saturn: "#896C39"
    Mercury: "#4C8DAE"
    Jupiter: "#549688"
    Venus: "#F2BE45"
    Qi: "#8D4BBB"
    Bei: "#425066"
    Ji: "#D3B17D"
    Luo: "#B35C44"
