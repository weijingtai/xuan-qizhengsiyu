<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代感标签布局重构</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            
            /* 喜格颜色 - 现代翠绿 */
            --pos-bg: #ecfdf5;
            --pos-text: #059669;
            --pos-border: #d1fae5;
            
            /* 忌格颜色 - 现代柔红 */
            --neg-bg: #fff1f2;
            --neg-text: #e11d48;
            --neg-border: #ffe4e6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 32px;
            width: 100%;
            max-width: 1000px;
        }

        /* 卡片设计：使用软阴影而非硬边框 */
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 16px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .count-badge {
            font-size: 0.875rem;
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* 标签云布局：Flex换行比死板的纵列更有活力 */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tag {
            padding: 8px 18px;
            border-radius: 100px; /* 胶囊形状 */
            font-size: 0.95rem;
            font-weight: 500;
            cursor: default;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        /* 喜格样式 */
        .card-pos .tag {
            background-color: var(--pos-bg);
            color: var(--pos-text);
            border-color: var(--pos-border);
        }

        .card-pos .tag:hover {
            background-color: var(--pos-text);
            color: white;
        }

        /* 忌格样式 */
        .card-neg .tag {
            background-color: var(--neg-bg);
            color: var(--neg-text);
            border-color: var(--neg-border);
        }

        .card-neg .tag:hover {
            background-color: var(--neg-text);
            color: white;
        }

        /* 响应式微调 */
        @media (max-width: 640px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-pos">
        <div class="card-header">
            <span class="card-title">政余喜格</span>
            <span class="count-badge">14 项</span>
        </div>
        <div class="tag-container">
            <div class="tag">火临燕地</div>
            <div class="tag">火星升殿</div>
            <div class="tag">木气扶火</div>
            <div class="tag">精神运转</div>
            <div class="tag">木入秦州</div>
            <div class="tag">岁居蟹鬼</div>
            <div class="tag">木星升殿</div>
            <div class="tag">水居土室</div>
            <div class="tag">冬水三令</div>
            <div class="tag">土在齐吴</div>
            <div class="tag">土号太常</div>
            <div class="tag">镇星居垣</div>
            <div class="tag">土好太常</div>
            <div class="tag">日温土化</div>
        </div>
    </div>

    <div class="card card-neg">
        <div class="card-header">
            <span class="card-title">政余忌格</span>
            <span class="count-badge">5 项</span>
        </div>
        <div class="tag-container">
            <div class="tag">金水背驰</div>
            <div class="tag">水流扬州</div>
            <div class="tag">土混水浊</div>
            <div class="tag">土混水浊</div>
            <div class="tag">土水相激</div>
        </div>
    </div>
</div>

</body>
</html>
