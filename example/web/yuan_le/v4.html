<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星体垣乐 - 进阶专业版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .num-font { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .row-hover:hover { transform: translateX(4px); transition: all 0.2s ease; }
    </style>
</head>
<body class="p-4 md:p-12">

    <div class="max-w-5xl mx-auto">
        <div class="flex items-end justify-between mb-8 px-2">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">星体垣乐</h1>
                <p class="text-slate-400 text-sm mt-1">天星运行数据实时演算分析</p>
            </div>
            <div class="text-right">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Version</span>
                <p class="text-sm font-bold text-indigo-500">PRO V2.0</p>
            </div>
        </div>

        <div class="glass-card border border-white shadow-xl rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50/50 border-b border-slate-100 text-slate-400 text-xs uppercase tracking-tighter">
                        <th class="px-6 py-4 font-bold">星体名称</th>
                        <th class="px-6 py-4 font-bold text-center">垣位状态</th>
                        <th class="px-6 py-4 font-bold">入宿方位 (0-30°)</th>
                        <th class="px-6 py-4 font-bold">入宫方位 (0-30°)</th>
                        <th class="px-6 py-4 font-bold text-right">实时动态</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100/60">
                    
                    <tr class="row-hover group bg-purple-50/20">
                        <td class="px-6 py-5">
                            <div class="flex items-center space-x-3">
                                <div class="w-2 h-8 bg-purple-500 rounded-full shadow-[0_0_8px_rgba(168,85,247,0.4)]"></div>
                                <span class="text-xl font-black text-slate-800">木</span>
                            </div>
                        </td>
                        <td class="px-6 py-5 text-center">
                            <span class="inline-flex items-center px-3 py-1 rounded-full bg-purple-100 text-purple-700 text-xs font-black shadow-sm border border-purple-200">旺</span>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex flex-col">
                                <div class="flex items-baseline space-x-2 mb-1.5">
                                    <span class="text-sm font-bold text-slate-500">井</span>
                                    <span class="num-font text-lg text-slate-700">13.20</span>
                                </div>
                                <div class="w-32 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                                    <div class="h-full bg-purple-500 rounded-full" style="width: 44%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex flex-col">
                                <div class="flex items-baseline space-x-2 mb-1.5">
                                    <span class="text-sm font-bold text-slate-500">未</span>
                                    <span class="num-font text-lg text-slate-700">05.09</span>
                                </div>
                                <div class="w-32 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                                    <div class="h-full bg-indigo-400 rounded-full" style="width: 17%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5 text-right">
                            <div class="inline-flex items-center space-x-1 px-3 py-1 bg-emerald-50 text-emerald-600 rounded-lg animate-pulse">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                <span class="text-sm font-black italic">逆</span>
                            </div>
                        </td>
                    </tr>

                    <tr class="row-hover group">
                        <td class="px-6 py-5 text-lg font-bold text-slate-800">
                            <div class="flex items-center space-x-3">
                                <div class="w-2 h-8 bg-red-400 rounded-full"></div>
                                <span class="text-xl font-black text-slate-800">土</span>
                            </div>
                        </td>
                        <td class="px-6 py-5 text-center">
                            <span class="inline-flex items-center px-3 py-1 rounded-full bg-red-50 text-red-500 text-xs font-black border border-red-100">庙</span>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex flex-col">
                                <div class="flex items-baseline space-x-2 mb-1.5">
                                    <span class="text-sm font-bold text-slate-400">斗</span>
                                    <span class="num-font text-lg text-slate-700 font-medium">19.21</span>
                                </div>
                                <div class="w-32 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                    <div class="h-full bg-red-400" style="width: 64%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5">
                            <div class="flex flex-col">
                                <div class="flex items-baseline space-x-2 mb-1.5">
                                    <span class="text-sm font-bold text-slate-400">丑</span>
                                    <span class="num-font text-lg text-slate-700 font-medium">15.39</span>
                                </div>
                                <div class="w-32 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                    <div class="h-full bg-slate-400" style="width: 51%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-5 text-right text-slate-300 font-mono text-sm tracking-widest">NORMAL</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <p class="mt-6 text-center text-slate-400 text-xs">
            数据更新于: 2026-03-16 17:34:08 · 基于地理坐标 (Las Vegas, NV)
        </p>
    </div>

</body>
</html>
