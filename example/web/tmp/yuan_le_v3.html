<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星体垣乐数据面板 - 优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 针对数字使用等宽字体，确保小数点对齐 */
        .font-mono-num {
            font-family: 'SF Mono', 'Roboto Mono', Menlo, monospace;
        }
        /* 微调标签阴影和质感 */
        .status-badge {
            text-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-gray-50 p-4 md:p-10 flex justify-center">

    <div class="w-full max-w-4xl bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        
        <div class="grid grid-cols-5 bg-gray-50/50 border-b border-gray-100 px-6 py-3 text-sm font-medium text-gray-400">
            <div>星体</div>
            <div class="text-center">垣位</div>
            <div>入宿度数</div>
            <div>入宫度数</div>
            <div class="text-right">状态</div>
        </div>

        <div class="divide-y divide-gray-50">
            
            <div class="grid grid-cols-5 items-center px-6 py-4 hover:bg-gray-50 transition-colors">
                <div class="text-lg font-bold text-gray-800">命主</div>
                <div class="text-center text-gray-300">-</div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm">斗</span>
                    <span class="font-mono-num text-gray-700 font-semibold">14.30</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm">戌</span>
                    <span class="font-mono-num text-gray-700 font-semibold">10.48</span>
                </div>
                <div class="text-right text-gray-300">-</div>
            </div>

            <div class="grid grid-cols-5 items-center px-6 py-4 bg-orange-50/30 hover:bg-orange-50/50 transition-colors">
                <div class="text-lg font-bold text-gray-800">日</div>
                <div class="flex justify-center">
                    <span class="status-badge bg-orange-100 text-orange-600 px-2 py-0.5 rounded text-xs font-bold border border-orange-200">喜</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm font-light">斗</span>
                    <span class="font-mono-num text-gray-700 font-semibold">14.30</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm font-light">丑</span>
                    <span class="font-mono-num text-gray-700 font-semibold">10.48</span>
                </div>
                <div class="text-right text-gray-300">-</div>
            </div>

            <div class="grid grid-cols-5 items-center px-6 py-4 bg-purple-50/30 hover:bg-purple-50/50 transition-colors">
                <div class="text-lg font-bold text-gray-800">木</div>
                <div class="flex justify-center">
                    <span class="status-badge bg-purple-100 text-purple-600 px-2 py-0.5 rounded text-xs font-bold border border-purple-200">旺</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm font-light">井</span>
                    <span class="font-mono-num text-gray-700 font-semibold">13.20</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm font-light">未</span>
                    <span class="font-mono-num text-gray-700 font-semibold">05.09</span>
                </div>
                <div class="text-right flex items-center justify-end space-x-1 text-emerald-600 font-bold">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>逆</span>
                </div>
            </div>

            <div class="grid grid-cols-5 items-center px-6 py-4 bg-red-50/30 hover:bg-red-50/50 transition-colors">
                <div class="text-lg font-bold text-gray-800">土</div>
                <div class="flex justify-center">
                    <span class="status-badge bg-red-100 text-red-600 px-2 py-0.5 rounded text-xs font-bold border border-red-200">庙</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm font-light">斗</span>
                    <span class="font-mono-num text-gray-700 font-semibold">19.21</span>
                </div>
                <div class="flex items-baseline space-x-1">
                    <span class="text-gray-400 text-sm font-light">丑</span>
                    <span class="font-mono-num text-gray-700 font-semibold">15.39</span>
                </div>
                <div class="text-right text-gray-300">-</div>
            </div>

        </div>
    </div>

</body>
</html>
